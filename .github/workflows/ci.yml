name: CI (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-with-docker-compose:
    name: Test Full Stack via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Temporary .env File
        run: |
          echo "MYSQL_ROOT_PASSWORD=booklog_project_password" > .env
          echo "MYSQL_DATABASE=booklog_db" >> .env
          echo "DATABASE_URL=mysql+pymysql://root:booklog_project_password@mysql-booklog:3306/booklog_db" >> .env

      - name: Build and Start Containers
        run: |
          docker compose up -d --build

      - name: Wait for Services to become Healthy
        run: |
          # Gives MySQL time to initialize and accept connections
          sleep 15
          docker compose ps

      - name: Test Backend Health
        run: |
          # Verifies your FastAPI container is responding over HTTP
          curl --fail http://localhost:8000/docs || curl --fail http://localhost:8000/

      - name: Test Frontend
        run: |
          # Verifies your Frontend/Nginx container is responding
          curl --fail http://localhost:3000 || curl --fail http://localhost:80

      - name: Tear Down Docker Compose
        if: always()
        run: |
          docker compose down -v
