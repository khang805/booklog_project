name: CI (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-fullstack-docker:
    name: Test Full Stack via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Temporary .env File
        run: |
          echo "MYSQL_ROOT_PASSWORD=booklog_project_password" > .env
          echo "MYSQL_DATABASE=booklog_db" >> .env
          echo "DATABASE_URL=mysql+pymysql://root:booklog_project_password@mysql-booklog:3306/booklog_db" >> .env

      - name: Build and Start Docker Containers
        run: |
          docker compose up -d --build

      - name: Wait for MySQL & Application Startup
        run: |
          # Gives MySQL time to satisfy healthcheck and allow backend/frontend to start
          sleep 15
          docker compose ps

      - name: Test Backend API
        run: |
          curl --fail http://localhost:8000/docs || curl --fail http://localhost:8000/

      - name: Test Frontend App
        run: |
          curl --fail http://localhost:5173

      - name: Debug Logs on Failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo "=== Backend Logs ==="
          docker compose logs backend-app
          echo "=== Frontend Logs ==="
          docker compose logs frontend-app

      - name: Tear Down Docker Compose
        if: always()
        run: |
          docker compose down -v
